<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>𝙽𝚊𝚖𝚊𝚣</title>
    <link rel="icon" href="file/namaz.png" title="" type="" />
    <link rel="preconnect" href="https://fonts.googleapis.com">

  <div class="container">
   <div style="display:flex;">

    <div id="greeting"></div>

        <div class="location-select">
            <select id="location" onchange="loadPrayerTimes()">
                <option value="Dhaka">ঢাকা</option>
                <option value="Chattogram">চট্টগ্রাম</option>
                <option value="Khulna">খুলনা</option>
                <option value="Rajshahi">রাজশাহী</option>
                <option value="Sylhet">সিলেট</option>
                <option value="Barishal">বরিশাল</option>
                <option value="Rangpur">রংপুর</option>
                <option value="Mymensingh">ময়মনসিংহ</option>
            </select>
        </div>
    </div>

    <!-- Countdown Timer -->
    <div id="countdown" class="countdown">পরবর্তী ওয়াক্তের  সময় লোড হচ্ছে...</div>

    <!-- Today's times grid -->
    <div id="today-times" class="today-times">
        <div class="loader">আজকের ওয়াক্তের সময় লোড হচ্ছে...</div>
    </div>

    <!-- Date Info -->
    <div id="date-info" class="date-info">
        <span>তারিখ লোড হচ্ছে...</span>
        
    </div>
   <p class="date-info" id="hijri-date">হিজরী তারিখ লোড হচ্ছে...</p>
    <p class="date-info" id="bangla-date">বাংলা তারিখ লোড হচ্ছে...</p>
    <!-- Monthly Table -->
    <div class="table-container">
        <h2 id="table-title">মাসিক সময়সূচি লোড হচ্ছে...</h2>
        <table id="prayer-table">
            <thead>
                <tr>
                    <th>তারিখ</th>
                    <th>ফজর</th>
                    <th>সূর্যোদয়</th>
                    <th>যোহর</th>
                    <th>আসর</th>
                    <th>সূর্যাস্ত</th>
                    <th>মাগরিব</th>
                    <th>ইশা</th>
                    <th>সেহরি</th> <!-- Sahri in table -->
                    <th>ইফতার</th> <!-- Iftar in table -->
                </tr>
            </thead>
            <tbody id="prayer-table-body">
                <!-- Initial loader state -->
                <tr>
                    <td colspan="10" class="loader">মাসিক সময়সূচি লোড হচ্ছে...</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>


<script src="file/app.js" type="text/javascript" charset="utf-8"></script>
